<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NES Game Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        .header h1 {
            color: #e94560;
            font-size: 2em;
        }
        .header p {
            color: #888;
            margin-top: 5px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }
        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .game-card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .game-card:hover {
            border-color: #e94560;
            transform: translateY(-2px);
        }
        .game-card h3 {
            color: #e94560;
            margin-bottom: 5px;
        }
        .game-card p {
            color: #888;
            font-size: 0.9em;
        }
        .upload-section {
            background: #16213e;
            border: 2px dashed #0f3460;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        .upload-section h2 { margin-bottom: 10px; }
        .upload-section input[type="file"] {
            margin: 10px 0;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover { background: #1a4a8a; }
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }
        #close-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        .no-games {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .status-msg {
            margin-top: 10px;
            font-size: 0.9em;
            color: #4ecca3;
        }
        .status-msg.error {
            color: #e94560;
        }
        footer {
            background: #16213e;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            border-top: 1px solid #0f3460;
            color: #888;
            font-size: 0.9em;
        }
        footer .heart {
            color: #e94560;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>&#127918; NES Game Player</h1>
        <p>Powered by EmulatorJS</p>
    </div>

    <div class="container">
        <!-- Upload section -->
        <div class="upload-section">
            <h2>Upload &amp; Play</h2>
            <p>Select a .nes ROM file &mdash; it will be saved to the server permanently</p>
            <br>
            <input type="file" id="rom-upload" accept=".nes">
            <br><br>
            <button class="btn" id="upload-play-btn" onclick="uploadAndPlay()">Upload &amp; Play</button>
            <button class="btn btn-secondary" id="upload-only-btn" onclick="uploadOnly()">Upload Only</button>
            <div id="upload-status" class="status-msg"></div>
        </div>

        <!-- Server-hosted ROM list -->
        <h2>&#128193; Game Library</h2>
        <div id="game-list" class="game-list">
            <div class="no-games">Loading...</div>
        </div>
    </div>

    <footer>
        Built and Hosted by Parveen Bhadoo <span class="heart">&#10084;</span>
    </footer>

    <!-- EmulatorJS Player -->
    <div id="player-container">
        <button id="close-btn" onclick="closePlayer()">&#10005; Close</button>
        <div id="game" style="width:100%;height:100%;"></div>
    </div>

    <script>
        // Load game list from server
        async function loadGameList() {
            const container = document.getElementById('game-list');
            try {
                const resp = await fetch('roms/index.json?t=' + Date.now());
                if (!resp.ok) throw new Error('No index.json');
                const games = await resp.json();
                if (games.length === 0) throw new Error('Empty');
                container.innerHTML = '';
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = '<h3>' + escapeHtml(game.name) + '</h3><p>Click to play</p>';
                    card.onclick = () => launchGame('roms/' + encodeURIComponent(game.file));
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<div class="no-games"><p>No games yet. Upload a .nes ROM above!</p></div>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setStatus(msg, isError) {
            const el = document.getElementById('upload-status');
            el.textContent = msg;
            el.className = 'status-msg' + (isError ? ' error' : '');
        }

        async function uploadToServer() {
            const fileInput = document.getElementById('rom-upload');
            if (!fileInput.files.length) {
                setStatus('Please select a .nes ROM file first', true);
                return null;
            }
            const file = fileInput.files[0];
            if (!file.name.toLowerCase().endsWith('.nes')) {
                setStatus('Only .nes files are supported', true);
                return null;
            }

            setStatus('Uploading ' + file.name + '...');
            document.getElementById('upload-play-btn').disabled = true;
            document.getElementById('upload-only-btn').disabled = true;

            try {
                const formData = new FormData();
                formData.append('rom', file);

                const resp = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await resp.json();

                if (!resp.ok || result.error) {
                    throw new Error(result.error || 'Upload failed');
                }

                setStatus('Uploaded successfully: ' + result.name);
                loadGameList(); // Refresh the list
                return result.file;
            } catch (e) {
                setStatus('Upload failed: ' + e.message, true);
                return null;
            } finally {
                document.getElementById('upload-play-btn').disabled = false;
                document.getElementById('upload-only-btn').disabled = false;
            }
        }

        async function uploadAndPlay() {
            const filename = await uploadToServer();
            if (filename) {
                launchGame('roms/' + encodeURIComponent(filename));
            }
        }

        async function uploadOnly() {
            await uploadToServer();
        }

        function launchGame(romUrl) {
            const playerDiv = document.getElementById('player-container');
            const gameDiv = document.getElementById('game');
            playerDiv.style.display = 'block';
            gameDiv.innerHTML = '';

            window.EJS_player = '#game';
            window.EJS_gameUrl = romUrl;
            window.EJS_core = 'nes';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const oldScript = document.getElementById('ejs-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'ejs-script';
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }

        function closePlayer() {
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('game').innerHTML = '';
            delete window.EJS_player;
            delete window.EJS_gameUrl;
            delete window.EJS_core;
            location.reload();
        }

        loadGameList();
    </script>
</body>
</html>
