<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NES Game Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        .header h1 {
            color: #e94560;
            font-size: 2em;
        }
        .header p {
            color: #888;
            margin-top: 5px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }
        .upload-section {
            background: #16213e;
            border: 2px dashed #0f3460;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        .upload-section h2 { margin-bottom: 10px; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover { background: #1a4a8a; }
        .status-msg {
            margin-top: 10px;
            font-size: 0.9em;
            color: #4ecca3;
        }
        .status-msg.error {
            color: #e94560;
        }
        .search-bar {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 1em;
            margin: 15px 0;
        }
        .search-bar:focus {
            outline: none;
            border-color: #e94560;
        }
        .search-bar::placeholder {
            color: #666;
        }
        .game-count {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 10px;
        }
        .game-list {
            list-style: none;
        }
        .game-row {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-bottom: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .game-row:first-child {
            border-radius: 8px 8px 0 0;
        }
        .game-row:last-child {
            border-bottom: 1px solid #0f3460;
            border-radius: 0 0 8px 8px;
        }
        .game-row:only-child {
            border-radius: 8px;
            border-bottom: 1px solid #0f3460;
        }
        .game-row:hover {
            background: #1a2a4e;
            border-color: #e94560;
        }
        .game-row:hover + .game-row {
            border-top-color: #e94560;
        }
        .game-row .game-name {
            flex: 1;
            color: #e0e0e0;
            font-size: 0.95em;
        }
        .game-row .play-icon {
            color: #e94560;
            font-size: 1.2em;
            margin-left: 10px;
        }
        .no-games {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }
        #close-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        footer {
            background: #16213e;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            border-top: 1px solid #0f3460;
            color: #888;
            font-size: 0.9em;
        }
        footer .heart {
            color: #e94560;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>&#127918; NES Game Player</h1>
        <p>Powered by EmulatorJS</p>
    </div>

    <div class="container">
        <!-- Upload section -->
        <div class="upload-section">
            <h2>Upload &amp; Play</h2>
            <p>Select a .nes ROM file &mdash; it will be saved to the server permanently</p>
            <br>
            <input type="file" id="rom-upload" accept=".nes">
            <br><br>
            <button class="btn" id="upload-play-btn" onclick="uploadAndPlay()">Upload &amp; Play</button>
            <button class="btn btn-secondary" id="upload-only-btn" onclick="uploadOnly()">Upload Only</button>
            <div id="upload-status" class="status-msg"></div>
        </div>

        <!-- Search and Game Library -->
        <h2>&#128193; Game Library</h2>
        <input type="text" id="search-bar" class="search-bar" placeholder="Search games..." oninput="filterGames()">
        <div id="game-count" class="game-count"></div>
        <ul id="game-list" class="game-list">
            <li class="no-games">Loading...</li>
        </ul>
    </div>

    <footer>
        Built and Hosted by Parveen Bhadoo <span class="heart">&#10084;</span>
    </footer>

    <!-- EmulatorJS Player -->
    <div id="player-container">
        <button id="close-btn" onclick="closePlayer()">&#10005; Close</button>
        <div id="game" style="width:100%;height:100%;"></div>
    </div>

    <script>
        let allGames = [];
        let filteredGames = [];
        let displayedCount = 0;
        const PAGE_SIZE = 50;
        let isLoadingMore = false;

        async function loadGameList() {
            try {
                const resp = await fetch('roms/index.json?t=' + Date.now());
                if (!resp.ok) throw new Error('No index.json');
                allGames = await resp.json();
                allGames.sort((a, b) => a.name.localeCompare(b.name));
                filterGames();
            } catch (e) {
                document.getElementById('game-list').innerHTML = '<li class="no-games">No games yet. Upload a .nes ROM above!</li>';
                document.getElementById('game-count').textContent = '';
            }
        }

        function filterGames() {
            const query = document.getElementById('search-bar').value.toLowerCase().trim();
            filteredGames = query
                ? allGames.filter(g => g.name.toLowerCase().includes(query))
                : allGames;

            const container = document.getElementById('game-list');
            const countEl = document.getElementById('game-count');

            if (filteredGames.length === 0) {
                container.innerHTML = '<li class="no-games">No games match your search</li>';
                countEl.textContent = query ? '0 results' : '';
                return;
            }

            countEl.textContent = query
                ? filteredGames.length + ' of ' + allGames.length + ' games'
                : allGames.length + ' games';

            container.innerHTML = '';
            displayedCount = 0;
            loadMoreGames();
        }

        function loadMoreGames() {
            if (isLoadingMore) return;
            isLoadingMore = true;

            const container = document.getElementById('game-list');
            const end = Math.min(displayedCount + PAGE_SIZE, filteredGames.length);

            for (let i = displayedCount; i < end; i++) {
                const game = filteredGames[i];
                const li = document.createElement('li');
                li.className = 'game-row';
                li.innerHTML = '<span class="game-name">' + escapeHtml(game.name) + '</span><span class="play-icon">&#9654;</span>';
                li.onclick = () => launchGame('roms/' + encodeURIComponent(game.file));
                container.appendChild(li);
            }

            displayedCount = end;

            // Remove old sentinel if exists
            const oldSentinel = document.getElementById('load-more-sentinel');
            if (oldSentinel) oldSentinel.remove();

            // Add "load more" sentinel if there are more games
            if (displayedCount < filteredGames.length) {
                const sentinel = document.createElement('li');
                sentinel.id = 'load-more-sentinel';
                sentinel.className = 'no-games';
                sentinel.textContent = 'Showing ' + displayedCount + ' of ' + filteredGames.length + ' \u2014 scroll for more';
                sentinel.style.cursor = 'pointer';
                sentinel.onclick = () => { loadMoreGames(); };
                container.appendChild(sentinel);
                observeSentinel(sentinel);
            }

            isLoadingMore = false;
        }

        // IntersectionObserver to auto-load more when scrolling near bottom
        let observer = null;
        function observeSentinel(el) {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    loadMoreGames();
                }
            }, { rootMargin: '200px' });
            observer.observe(el);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setStatus(msg, isError) {
            const el = document.getElementById('upload-status');
            el.textContent = msg;
            el.className = 'status-msg' + (isError ? ' error' : '');
        }

        async function uploadToServer() {
            const fileInput = document.getElementById('rom-upload');
            if (!fileInput.files.length) {
                setStatus('Please select a .nes ROM file first', true);
                return null;
            }
            const file = fileInput.files[0];
            if (!file.name.toLowerCase().endsWith('.nes')) {
                setStatus('Only .nes files are supported', true);
                return null;
            }

            setStatus('Uploading ' + file.name + '...');
            document.getElementById('upload-play-btn').disabled = true;
            document.getElementById('upload-only-btn').disabled = true;

            try {
                const formData = new FormData();
                formData.append('rom', file);

                const resp = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await resp.json();

                if (!resp.ok || result.error) {
                    throw new Error(result.error || 'Upload failed');
                }

                setStatus('Uploaded successfully: ' + result.name);
                // Reload the full game list
                await loadGameList();
                return result.file;
            } catch (e) {
                setStatus('Upload failed: ' + e.message, true);
                return null;
            } finally {
                document.getElementById('upload-play-btn').disabled = false;
                document.getElementById('upload-only-btn').disabled = false;
            }
        }

        async function uploadAndPlay() {
            const filename = await uploadToServer();
            if (filename) {
                launchGame('roms/' + encodeURIComponent(filename));
            }
        }

        async function uploadOnly() {
            await uploadToServer();
        }

        function launchGame(romUrl) {
            const playerDiv = document.getElementById('player-container');
            const gameDiv = document.getElementById('game');
            playerDiv.style.display = 'block';
            gameDiv.innerHTML = '';

            window.EJS_player = '#game';
            window.EJS_gameUrl = romUrl;
            window.EJS_core = 'nes';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const oldScript = document.getElementById('ejs-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'ejs-script';
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }

        function closePlayer() {
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('game').innerHTML = '';
            delete window.EJS_player;
            delete window.EJS_gameUrl;
            delete window.EJS_core;
            location.reload();
        }

        loadGameList();
    </script>
</body>
</html>
